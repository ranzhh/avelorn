# The development stack: the API and the unit browser, both with reload.
#
# The source is bind-mounted rather than baked in, so an edit on the host is
# picked up by the process in the container. `make serve` and `make frontend`
# still run the same two processes natively.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/units')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The proxy target: another container here, localhost when run natively.
      AVELORN_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      # Keeps the image's install, which is built for the container, rather
      # than whatever the host resolved into ./frontend/node_modules.
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
