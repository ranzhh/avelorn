[project]
name = "avelorn"
version = "0.1.0"
description = "Tabletop wargame toolkit: unit database, army list planner, and combat math, starting with Warhammer: The Old World"
authors = [{ name = "Matteo Ranzetti", email = "ranzetti.matteo@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The HTTP surface, optional: importing the engine must not require a web
# framework. `uv sync --extra api` to serve it.
api = ["fastapi[standard]>=0.115"]

[dependency-groups]
# The API tests drive the app in process through Starlette's TestClient, which
# wants httpx2 and warns on the httpx that fastapi[standard] brings.
dev = [
    "pre-commit",
    "pytest>=9.0.3",
    "ruff>=0.15",
    "ty>=0.0.39",
    "fastapi[standard]>=0.115",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 99

[tool.ruff.lint]
# preview is required for the DOC (pydoclint) rules, which are preview-only
preview = true
select = [
    "ERA", # Eradicate: raises issues when it finds commented-out code.
    "F",   # Pyflakes: general rules
    "E",   # pycodestyle
    "DOC", # pydoclint: ensures every documentation and args etc on functions
    "D",   # pydocstyle: style of documentation and what can be undocumented
    "I",   # isort: Sort imports
    "UP",  # pyupgrade: stylistic upgrades for the current python-version
    "B",   # flake8-bugbear
    "G",   # flake8-logging-format
    "T20", # flake8-print
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "TRY", # tryceratops
    "ANN401", # flake8-annotations: disallow typing.Any in annotations
    "RUF001", # ruff: ambiguous unicode char in a string - prefer ASCII
    "RUF002", # ruff: ambiguous unicode char in a docstring - prefer ASCII
    "RUF003", # ruff: ambiguous unicode char in a comment - prefer ASCII
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts report to the terminal by design.
"scripts/*" = ["T20"]

[tool.ruff.lint.flake8-annotations]
# *args/**kwargs pass-throughs need Any to typecheck at the forwarding call site
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"
