default_language_version:
  python: python3

# `pre-commit install` (make install) installs both stages.
default_install_hook_types: [pre-commit, commit-msg]

exclude: ^tests/pins/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: check-case-conflict # checks for files that would conflict in case-insensitive file systems
      - id: check-docstring-first # checks a common error of defining a docstring after code
      - id: check-merge-conflict # checks for files that contain merge conflict strings
      - id: check-toml # checks toml files for parseable syntax
      - id: check-yaml # checks yaml files for parseable syntax
      - id: debug-statements # checks for debugger imports and py37+ `breakpoint()` calls in python source
      - id: detect-private-key # detects the presence of private keys
      - id: end-of-file-fixer # ensures that a file is either empty, or ends with one newline
      - id: mixed-line-ending # replaces or checks mixed line ending
      - id: name-tests-test # verifies that test files are named correctly
        args: [--pytest-test-first] # repo convention is pytest-style test_*.py
        exclude: ^tests/(oracle/procedure|rules/scenario)\.py$
      - id: trailing-whitespace # trims trailing whitespace

  # ruff and ty run from the project venv, so the versions come from uv.lock —
  # one source of truth shared with the editor and CI. Update with:
  #   uv lock --upgrade-package ruff --upgrade-package ty && uv sync --group dev
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true # ruff parallelizes internally; one invocation is fastest
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  # prettier and eslint run from frontend/node_modules, so the versions come
  # from package-lock.json — the same one source of truth CI installs from.
  # Needs `npm ci` in frontend/ first, as the hooks above need `uv sync`.
  - repo: local
    hooks:
      - id: frontend-lint
        name: prettier and eslint
        entry: make frontend-lint
        language: system
        files: ^frontend/
        pass_filenames: false

  # Conventional Commits. Commits allow fixup! and merge commits; the PR title,
  # which becomes the squash commit on dev, does not. CI runs both.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, perf, test, docs, chore, build, ci]
      - id: conventional-pre-commit
        alias: pr-title
        stages: [manual]
        args: [--strict, feat, fix, refactor, perf, test, docs, chore, build, ci]
