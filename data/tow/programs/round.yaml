program: round
sequence: combat
fielded: [attacker, target]
inputs:
  - {fact: standing, of: attacker}
  - {fact: standing, of: target}
  - {known: standing-at-start-of-round, of: attacker, type: standing}
  - {known: standing-at-start-of-round, of: target, type: standing}
  - {known: standing-at-start-of-turn, of: attacker, type: standing}
  - {known: standing-at-start-of-turn, of: target, type: standing}
  - {fact: rounds-fought, of: attacker}
  - {fact: rounds-fought, of: target}
  - {fact: charges-made, of: attacker}
  - {fact: charges-made, of: target}
  - {fact: charge-move, of: attacker}
  - {fact: charge-move, of: target}
  - {fact: enemy-arc, of: attacker}
  - {fact: enemy-arc, of: target}
  - {fact: charges-received, of: attacker}
  - {fact: charges-received, of: target}
  - {fact: break-tests-taken, of: attacker}
  - {fact: break-tests-taken, of: target}
  - {fact: uses-this-game, of: attacker}
  - {fact: uses-this-game, of: target}
items:
  - {step: the-charge-move, sequence: charge, of: [attacker, target]}
  - {step: choose-combat-and-determine-who-can-fight, of: [attacker, target]}
  - {step: who-can-fight, of: [attacker, target]}
  - {step: who-strikes-first, of: [attacker, target]}
  - slot: impact-hits
    items:
      - {step: impact-hits, of: [attacker, target], readings: [hits, parts, fighting]}
      - group: attack
        for: each-fighter
        of: [attacker, target]
        times: impact-hits
        items:
          - roll-to-wound
          - make-armour-saves
          - {step: ward-saves, readings: [unsaved]}
      - {step: remove-casualties, of: [target, attacker], tallies: [attack], readings: [models]}
  - slots: initiative
    from: 10
    to: 1
    items:
      - {step: how-many-attacks, of: [attacker, target], readings: [attacks, parts, fighting]}
      - group: attack
        for: each-fighter
        of: [attacker, target]
        times: how-many-attacks
        items:
          - roll-to-hit
          - roll-to-wound
          - make-armour-saves
          - {step: ward-saves, readings: [unsaved]}
      - {step: remove-casualties, of: [target, attacker], tallies: [attack], readings: [models]}
  - slot: stomp-attacks
    items:
      - {step: stomp-attacks, of: [attacker, target], readings: [hits, parts, fighting]}
      - group: attack
        for: each-fighter
        of: [attacker, target]
        times: stomp-attacks
        items:
          - roll-to-wound
          - make-armour-saves
          - {step: ward-saves, readings: [unsaved]}
      - {step: remove-casualties, of: [target, attacker], tallies: [attack], readings: [models]}
  - step: calculate-combat-result
    sequence: combat-result
    of: [attacker, target]
    readings: [score]
  - step: who-is-the-winner
    sequence: combat-result
    of: [attacker, target]
    readings: [result, margin]
  - step: break-test
    sequence: break
    of: [attacker, target]
    readings: [test]
  - step: loser-falls-back-in-good-order
    sequence: break
    of: [attacker, target]
    readings: [result]
