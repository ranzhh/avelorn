# Demonstration rule, NOT a printed entry (no Source header, so the
# re-import check skips it): the bearer-subject save re-roll of the
# cross-side design. The sentence speaks of the bearer's own Armour
# Saves, so nothing is authored beyond the re-roll itself: Make Armour
# Saves is the target's die, so the grant reaches only the attacks the
# bearer suffers — a unit carrying this strikes without touching the
# enemy's saves.
id: demo-runeplate
name: Demo Runeplate
category: Demo
paragraphs:
  - A model with this special rule may re-roll any Armour Save roll of a natural 1.
effects:
  - reroll: make-armour-saves
    on_natural: 1
