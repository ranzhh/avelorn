# Source: https://tow.whfb.app/special-rules/poisoned-attacks
id: poisoned-attacks
name: Poisoned Attacks
page: 175
category: Special Rules
flavour: Deadly toxins can turn an otherwise minor injury into a mortal wound.
paragraphs:
  - If a model with Poisoned Attacks rolls a natural 6 when making a roll To Hit, it may apply a +2 modifier to that hit’s
    roll To Wound. Unless otherwise stated, a model with this special rule may use it when making both shooting and combat
    attacks. Any spells cast by the model are unaffected, as are any attacks made with magic weapons.
  - Note that if an attack needs a To Hit roll of 7+, or hits automatically, this special rule cannot be used.
