id: hatred
name: Hatred (X)
parameter:
  kind: selector
  values:
    all-enemies:
      printed: all enemies
    orcs-and-goblins:
      printed: Orcs & Goblins
page: 171
category: Special Rules
flavour: Enmity is rife in the Warhammer world, but hatred is nurtured over thousands of years.
paragraphs:
  - A model with this special rule may re-roll any failed rolls To Hit made against a hated enemy during the first round of
    combat.
  - Which enemies are hated varies from model to model and will be shown in brackets after the name of this special rule (shown
    here as 'X'). Some models hate 'all enemies', meaning they hate all enemy models equally.
