# Source: https://tow.whfb.app/special-rules/dragon-armour
id: dragon-armour
name: Dragon Armour
page: 184
category: Special Rules
flavour: Dragon armour is forged in the heart of a volcano by the most skilled of artificers and decorated beyond the skill
  of any mere mortal artisan. Yet, more than its exquisite form, what makes Dragon armour so desirable are the many potent
  enchantments that ward against the blows of the enemy.
paragraphs:
  - A model with this special rule has a 6+ Ward save against any wounds suffered. In addition, a Wizard with this special
    rule may wear armour without penalty.
effects:
  - set:
      ward-save: 6
notes: The armour-without-penalty clause is for Wizards, and no Wizard exists to wear it (#10).
