# Source: https://tow.whfb.app/special-rules/drilled
id: drilled
name: Drilled
page: 167
category: Special Rules
flavour: Some regiments spend endless hours training to perform complex manoeuvres.
paragraphs:
  - Unless it is fleeing, a Drilled unit may perform a free redress the ranks manoeuvre immediately before moving. Once this
    manoeuvre is complete, the unit moves as normal. In addition, a Drilled unit can march whilst within 8" of an enemy unit
    without first having to make a Leadership test.
  - Note that any character that joins a Drilled unit is considered to be Drilled as well.
