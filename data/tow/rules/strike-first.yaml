# Source: https://tow.whfb.app/special-rules/strike-first
id: strike-first
name: Strike First
page: 177
category: Special Rules
flavour: Some warriors are gifted with supernatural speed and reactions, whilst others bear weapons enchanted to move
  like quicksilver through the air.
paragraphs:
  - During the Combat phase, a model with this special rule that is engaged in combat improves its Initiative
    characteristic to 10 (before any other modifiers are applied). If a model has both this rule and Strike Last, the
    two rules cancel one another out.
# The cancellation with Strike Last is honoured structurally, not authored: two
# rules setting one characteristic to different values cancel in the fold.
effects:
  - set:
      I: 10
