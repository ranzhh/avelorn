# Source: https://tow.whfb.app/special-rules/requires-two-hands
id: requires-two-hands
name: Requires Two Hands
page: 176
category: Special Rules
flavour: Many weapons are unwieldy, requiring a firm two-handed grip in order to use effectively.
paragraphs:
  - A model cannot use a shield alongside a weapon with this special rule during the Combat phase (a shield can still be used
    against wounds caused by shooting or magic during other phases of the game).
# The shield is withdrawn from what the model effectively wears — the piece and
# its whole bonus, not a counter-modifier. Kept against shooting, as printed.
effects:
  - when:
      combat: true
    bars: Shield
notes: That the model cannot even be armed with the pairing is equipment legality (#17).
