# Demonstration rule, NOT a printed entry (no Source header, so the
# re-import check skips it): the enemy-subject re-roll of the cross-side
# design. The sentence's subject is the enemy and the covered dice are
# its successful ones, both transcribed; the enemy flip puts the grant on
# the attacks the bearer makes, re-rolling the target's passed saves.
id: demo-sundering
name: Demo Sundering
category: Demo
paragraphs:
  - Enemy units must re-roll successful Armour Saves against attacks made by a model with
    this special rule.
effects:
  - reroll: make-armour-saves
    of: successful
    enemy: true
