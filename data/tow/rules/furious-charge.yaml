# Source: https://tow.whfb.app/special-rules/furious-charge
id: furious-charge
name: Furious Charge
page: 171
category: Special Rules
flavour: Some warriors charge home with such fury that their first blows land with redoubled ferocity.
paragraphs:
  - During a turn in which it made a charge move of 3" or more, a model with this special rule gains a +1 modifier to
    its Attacks characteristic.
# A supporting attack is one each regardless, so the +1 shapes the fighting
# rank's blows only.
effects:
  - when:
      movement:
        charge:
          distance:
            at_least: 3
    add:
      A: 1
