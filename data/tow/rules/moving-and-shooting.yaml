# Source: https://tow.whfb.app/the-shooting-phase/moving-and-shooting
id: moving-and-shooting
name: Moving and Shooting
page: 139
category: The Shooting Phase
paragraphs:
  - Models that have moved for any reason during this turn (including rallying and reforming) have less time to aim and suffer
    a -1 To Hit modifier.
effects:
  - when:
      facts: [{fact: moved, of: this-model, is: true}]
    add: {to-hit: -1}
    at: {step: roll-to-hit, by: this-model, in: shooting}
    legacy:
      when: {movement: {moved: true}}
