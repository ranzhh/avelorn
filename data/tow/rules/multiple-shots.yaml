# Source: https://tow.whfb.app/special-rules/multiple-shots
id: multiple-shots
name: Multiple Shots (X)
parameter:
  kind: amount
  dice: true
  min: 2
page: 174
category: Special Rules
flavour: Some weapons fire a fusillade of shots, sacrificing accuracy for sheer volume.
paragraphs:
  - A weapon with this special rule can either fire a single shot as normal, or it can be fired a number of times, as shown
    in brackets after the name of this special rule (shown here as 'X'). If multiple shots are fired, each roll To Hit suffers
    an additional -1 To Hit modifier. All models in a unit equipped with weapons with this special rule must fire either a
    single or Multiple Shots. Where the number of Multiple Shots is generated by a dice roll, roll separately for each model.
