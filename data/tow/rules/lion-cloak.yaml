# Source: https://tow.whfb.app/special-rules/lion-cloak
id: lion-cloak
name: Lion Cloak
page: 185
category: Special Rules
flavour: The thick pelt of a Chracian White Lion offers exemplary protection against arrows and shot, though to wear such
  a trophy a warrior must have earned the right, and this honour is reserved only for those that have completed the rites
  of a Chracian warrior.
paragraphs:
  - A model with this special rule improves its armour value by 1 (to a maximum of 2+) against non-magical shooting
    attacks.
# Hand-authored, diffable against the paragraph above: +1 armour value (a better
# save, so the save target lowers by one), capped at the best save of 2+, gated
# on the incoming attack — a shooting attack that is not magical. Unlike Parry
# (a state gate: whilst engaged in close combat), this reads the attack itself,
# so it is a `target_of` gate: `kind: shooting` and `magical: false` (the reason
# it does not help against a magical bow, e.g. the Bow of Avelorn).
effects:
  - when:
      target_of:
        kind: shooting
        magical: false
    add:
      armour-value: 1
    maximum: 2
