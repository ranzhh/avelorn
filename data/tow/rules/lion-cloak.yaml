# Source: https://tow.whfb.app/special-rules/lion-cloak
id: lion-cloak
name: Lion Cloak
page: 185
category: Special Rules
flavour: The thick pelt of a Chracian White Lion offers exemplary protection against arrows and shot, though to wear such
  a trophy a warrior must have earned the right, and this honour is reserved only for those that have completed the rites
  of a Chracian warrior.
paragraphs:
  - A model with this special rule improves its armour value by 1 (to a maximum of 2+) against non-magical shooting
    attacks.
effects:
  - when: {attack: {magical: false}}
    add: {armour-value: {amount: 1, maximum: 2}}
    at: {step: make-armour-saves, by: this-model, in: shooting}
