# Source: https://tow.whfb.app/special-rules/skirmishers
id: skirmishers
name: Skirmishers
page: 177
category: Special Rules
flavour: Units of skirmishers move quickly and freely, harassing the enemy's flanks.
paragraphs:
  - A unit consisting of models with this special rule may adopt a Skirmish formation.
may: true
needs: [formations]
effects:
  - grants: skirmish-formation
    to: this-model
    legacy:
      grants: enemy-fire-skirmishers
notes: the volley and the round report the lane in which the formation is
  adopted.
