# Source: https://tow.whfb.app/special-rules/skirmishers
id: skirmishers
name: Skirmishers
page: 177
category: Special Rules
flavour: Units of skirmishers move quickly and freely, harassing the enemy's flanks.
paragraphs:
  - A unit consisting of models with this special rule may adopt a Skirmish formation.
# Formations are not modelled yet, so a unit with this rule is taken to be
# skirmishing. The -1 To Hit is the formation's own rule, conferred by a grant
# so its effects stay authored on that entry.
effects:
  - grants: Enemy Fire (Skirmishers)
caveats: the Skirmish formation is not modelled; a unit with this rule is taken to be skirmishing at all times.
