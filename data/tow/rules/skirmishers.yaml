# Source: https://tow.whfb.app/special-rules/skirmishers
id: skirmishers
name: Skirmishers
page: 177
category: Special Rules
flavour: Units of skirmishers move quickly and freely, harassing the enemy's flanks.
paragraphs:
  - A unit consisting of models with this special rule may adopt a Skirmish formation.
# The graph grants the formation, which the player may decline. The legacy
# engine takes the formation as adopted and grants its -1 To Hit directly.
may: true
needs: [formations]
effects:
  - grants: skirmish-formation
    to: this-model
    legacy:
      grants: enemy-fire-skirmishers
notes: the legacy engine takes a unit with this rule to be in Skirmish
  formation at all times.
