# Source: https://tow.whfb.app/special-rules/champions-of-chrace
id: champions-of-chrace
name: Champions of Chrace
page: 42
category: Special Rules
flavour: Even amongst the warriors of Chrace, the Lion Guard are renowned fighters, eager to best their foes in single combat.
paragraphs:
  - Any model in a unit of Lion Guard can accept challenges in the same manner as a character. In addition, once per turn
    a character that has joined a unit of Lion Guard may re-roll their "Look Out, Sir!" roll.
