# Source: https://tow.whfb.app/special-rules/large-target
id: large-target
name: Large Target
page: 172
category: Special Rules
flavour: Monstrous creatures tower above the battlefield, visible to all for leagues around.
paragraphs:
  - Large Targets do not benefit from partial or full cover. In addition, a unit can draw a line of sight to a Large Target
    over or through another unit, and vice versa, provided that unit is not also a Large Target. Finally, a unit that shoots
    at a Large Target can shoot with one additional rank. For example, a unit armed with crossbows can shoot with its first
    two ranks when shooting at a Large Target, or with its first three if also standing on a hill.
