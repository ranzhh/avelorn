# Source: https://tow.whfb.app/troop-types-in-detail/fight-in-extra-rank
id: fight-in-extra-rank
name: Fight In Extra Rank
category: Troop Types
paragraphs:
  - Certain weapons, such as thrusting or throwing spears, allow warriors not in the fighting rank
    to attack from behind their comrades. A model with this special rule may make a supporting attack.
# The `movement.charge: false` gate is thrusting spear's printed restriction
# ("cannot make a supporting attack during a turn in which it charged") — our
# only carrier. A Fight-in-Extra-Rank weapon without it would move the gate
# onto the weapon.
effects:
  - when:
      movement:
        charge: false
    add:
      supporting-ranks: 1
