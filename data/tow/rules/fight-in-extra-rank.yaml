# Source: https://tow.whfb.app/troop-types-in-detail/fight-in-extra-rank
id: fight-in-extra-rank
name: Fight In Extra Rank
category: Troop Types
paragraphs:
  - Certain weapons, such as thrusting or throwing spears, allow warriors not in the fighting rank
    to attack from behind their comrades. A model with this special rule may make a supporting attack.
# The no-charge gate is the printed restriction of every weapon carrying the
# rule (thrusting spear, cavalry spear, ceremonial halberd). A carrier without
# it would move the gate onto the weapon.
effects:
  - unless:
      facts: [{fact: charges-made, of: this-model, more-than: 0}]
    allow: [supporting-attack]
    at: {step: who-can-fight, by: this-model}
    legacy:
      when: {movement: {charge: false}}
      add: {supporting-ranks: 1}
