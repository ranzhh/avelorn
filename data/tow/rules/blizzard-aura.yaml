# Source: https://tow.whfb.app/special-rules/blizzard-aura
id: blizzard-aura
name: Blizzard Aura
page: 176
category: Special Rules
flavour: The ice that sheathes a Frostheart Phoenix is as hard as glass, and enemies find their own strength and resolve eaten
  away by its chill presence.
paragraphs:
  - Whilst in base contact with this model, enemy models become subject to the Strike Last special rule.
needs: [base-contact]
effects:
  - grants: strike-last
    to: the-enemy
notes: base contact is read as being engaged in the combat — the whole engaged
  enemy unit strikes last, not only the models touching this one; mount rows
  are read printed, so an engaged foe's mounts keep their own Initiative.
