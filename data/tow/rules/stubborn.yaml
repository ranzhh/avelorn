# Source: https://tow.whfb.app/special-rules/stubborn
id: stubborn
name: Stubborn
page: 178
category: Special Rules
paragraphs:
  - The first time this unit is required to make a Break test it may choose not to and will
    automatically Falling Back in Good Order instead, even if the Unit Strength of the winning side
    is more than twice that of the losing side. A unit that is not Stubborn does not become Stubborn
    when joined by a character that is. A Stubborn character cannot use this special rule whilst part
    of a unit that is not Stubborn.
# Hand-authored, diffable against the paragraph: "automatically Fall Back in Good Order" is a
# choice effect forcing that Break-test outcome. What this build does not cover is authored in
# `notes` below, which break_test surfaces when the rule fires.
notes: >-
  Modelled for a single round with no player choice: the "first Break test of the battle" limit is
  not tracked (no multi-turn state) and the rule is always applied, never declined. A would-be Give
  Ground is folded into the automatic Fall Back in Good Order; and the "more than twice the Unit
  Strength" clause is moot, since the auto-rout it overrides is not modelled.
effects:
  - forces: fall-back-in-good-order
