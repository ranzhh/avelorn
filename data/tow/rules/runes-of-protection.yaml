# Source: https://tow.whfb.app/special-rules/runes-of-protection
id: runes-of-protection
name: Runes of Protection
page: 24
category: Special Rules
flavour: Ironbreakers venture into the dark beneath the world protected from the terrors it hides by rune encrusted suits
  of gromril armour.
paragraphs:
  - Models with this special rule have a 6+ Ward save against any wounds suffered that were caused by a non-magical enemy
    attack.
# Every attack the engine resolves is an enemy's, so "enemy attack" adds no
# further gate; wounds from spells are not modelled, so nothing over-applies.
effects:
  - when:
      target_of:
        magical: false
    set:
      ward-save: 6
