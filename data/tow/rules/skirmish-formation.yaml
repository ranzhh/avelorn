# Source: https://tow.whfb.app/unusual-formations/skirmish-formation
id: skirmish-formation
name: Skirmish Formation
page: 184
category: Unusual Formations
paragraphs:
  - A unit of models in Skirmish formation (often referred to as 'Skirmishers' in the rules that follow) never consists of
    rigid ranks and files. Instead, it moves as a single loose group or rough line. This enables Skirmishers to move quickly
    and take advantage of terrain to shelter from the enemy.
# The -1 To Hit is conferred by a grant, so "Enemy Fire (Skirmishers)" keeps
# its effects on its own entry. Same shape as skirmishers.yaml.
effects:
  - grants: Enemy Fire (Skirmishers)
notes: only the formation's Enemy Fire rule is modelled; the loose group's
  movement, its lack of ranks and files, and its use of terrain are not.
