# Source: https://tow.whfb.app/special-rules/vanguard
id: vanguard
name: Vanguard
page: 180
category: Special Rules
flavour: An army's vanguard advances to occupy and engage the foe ahead of their comrades.
paragraphs:
  - After deployment, units with this special rule may make a Vanguard move. A unit making a Vanguard move moves as described
    in the Basic Movement rules. It may manoeuvre normally but cannot march.
  - If both armies contain Vanguard units, a roll-off determines who moves first. The players then alternate moving their
    Vanguard units one at a time, starting with the player who won the roll-off. Units that make a Vanguard move cannot declare
    a charge during their first turn.
