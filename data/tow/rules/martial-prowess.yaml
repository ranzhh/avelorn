# Source: https://tow.whfb.app/special-rules/martial-prowess
id: martial-prowess
name: Martial Prowess
page: 185
category: Special Rules
flavour: Elven warriors spend many hours mastering the art of war, wielding their weapons with a skill and grace absent from
  the ranks of their enemies.
paragraphs:
  - During the first round of combat, a unit with this special rule gains a +1 modifier to its Weapon Skill characteristic. In
    addition, a unit with this special rule can make supporting attacks to its flank or rear, as well as to its front.
# The flank/rear supporting-attacks clause is unexpressed: it has no effect on
# the frontal combat modelled today and waits on #28, rather than being
# approximated with a kind bespoke to one rule.
effects:
  - when:
      combat:
        first_round: true
    add:
      WS: 1
corrections:
  - op: replace
    path: /page
    expect: 25
    value: 185
    why: 'The rule is printed in Dark Elves (p. 25), Forces of Fantasy (pp. 129 & 185) and Arcane Journal: Wood Elf Realms
      (p. 39). The source cites the Dark Elves printing; this corpus cites the Forces of Fantasy High Elf grouping, matching
      Valour of Ages.'
