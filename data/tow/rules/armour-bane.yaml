# Source: https://tow.whfb.app/special-rules/armour-bane
id: armour-bane
name: Armour Bane (X)
page: 166
category: Special Rules
flavour: Some weapons are particularly well-suited to piercing armour, though they often require great skill.
paragraphs:
  - If a model with this special rule rolls a natural 6 when making a roll To Wound, the Armour Piercing characteristic of
    its weapon is improved by the amount shown in brackets after the name of this special rule (shown here as 'X').
  - For example, if a natural 6 is rolled when rolling To Wound with a weapon that has an AP of ' - ' and the Armour Bane
    (1) special rule, its AP counts as being -1 when making an Armour Save roll against that wound.
# Hand-authored, diffable against the paragraphs above.
effects:
  - when:
      natural:
        face: 6
        roll: roll-to-wound
    then:
      armour-piercing: X
