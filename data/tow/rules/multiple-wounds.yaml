# Source: https://tow.whfb.app/special-rules/multiple-wounds
id: multiple-wounds
name: Multiple Wounds (X)
page: 175
category: Special Rules
flavour: The most powerful attacks strike with crushing force, causing massive damage to their victim.
paragraphs:
  - Each unsaved wound inflicted by an attack with this special rule is multiplied by the number shown in brackets after the
    name of this special rule (shown here as 'X'). For example, Multiple Wounds (2) would mean that each unsaved wound would
    cause the target to lose two Wounds. Where the number of Multiple Wounds is generated by a dice roll, roll separately
    for each unsaved wound.
  - Note that excess wounds caused to a model will have no additional effect unless that model is a character, in which case
    this special rule counts for Overkill. Excess wounds do not 'spill over' onto other models in the unit.
# Neither cap clause is authored here. Both belong to Remove Casualties, where
# a wound meets a model with so many Wounds left.
effects:
  - multiplies: X
notes: Overkill in a challenge is not modelled. The multiplied wounds do score
  for combat result — a round counts the Wounds inflicted, capped at what the
  target could lose — but a Stand & Shoot volley's contribution is still
  credited as models removed, exact only while every profile has one Wound.
