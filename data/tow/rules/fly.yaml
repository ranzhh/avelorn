# Source: https://tow.whfb.app/special-rules/fly
id: fly
name: Fly (X)
parameter:
  kind: amount
page: 170
category: Special Rules
flavour: Many creatures of the Warhammer world can fly, held aloft either by mighty pinions or by means of magic, soaring
  from one side of the battlefield to the other.
paragraphs:
  - 'Except when following up or pursuing, a model with this special rule can choose to move by flying through the air, rather
    than moving across the ground as normal. When a model flies it uses a special ‘Fly Movement’ characteristic, shown in
    brackets after the name of this special rule (shown here as ‘X’). Models that choose to move by flying:'
  - May move as normal (i.e., they may charge, march and manoeuvre as if moving on the ground), except that they are able
    to pass freely above other models, units and terrain features without any penalty, and they can march whilst within 8"
    of an enemy unit without first having to make a Leadership test.
  - May end their movement in terrain, but will suffer its effects if they do. They cannot end their movement 'on top' of
    impassable terrain or another unit, or within 1" of an enemy unit.
  - Models that can Fly must begin and end all of their movement on the ground. A character with this special rule cannot
    join a unit without this special rule, and vice versa.
