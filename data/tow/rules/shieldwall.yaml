# Source: https://tow.whfb.app/special-rules/shieldwall
id: shieldwall
name: Shieldwall
page: 177
category: Special Rules
flavour: Presenting an impenetrable wall of shields to the foe, a regiment becomes almost unmovable.
paragraphs:
  - Once per game, during a turn in which it was charged, a unit with this special rule that is arrayed in a Close Order formation,
    and that is equipped with and chooses to use shields, may Give Ground rather than Fall Back in Good Order.
# A two-handed wielder's shield is withdrawn, so its wall never forms.
may: true
needs: [formations]
effects:
  - when:
      worn: {armour: shield}
      facts: [{fact: charges-received, of: this-model, more-than: 0}]
    substitute: {fall-back-in-good-order: gives-ground}
    at: {step: loser-falls-back-in-good-order, by: this-model}
    limit: {per: game, times: 1}
notes: >-
  The round reports the lane in which it is taken. Each round starts with no use recorded, so the
  once-per-game limit is not carried from one round to the next. The Close Order requirement is a
  formation, which the engine does not model (#28), so it is not gated.
