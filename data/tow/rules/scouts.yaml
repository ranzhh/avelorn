# Source: https://tow.whfb.app/special-rules/scouts
id: scouts
name: Scouts
page: 177
category: Special Rules
flavour: Scouts are advance troops who sneak onto the battlefield in order to seize vital locations before the two armies
  clash.
paragraphs:
  - Units with this special rule may be deployed after all other units from both armies. They can be deployed anywhere on
    the battlefield that is more than 12" away from an enemy model. If deployed in this way, Scouts cannot declare a charge
    during their first turn.
  - If both armies contain Scouts, a roll-off should determine which player deploys Scouts first. The players then alternate
    deploying their scouting units one at a time, starting with the player who won the roll-off.
