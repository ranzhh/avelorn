# Source: https://tow.whfb.app/special-rules/abyssal-cloak
id: abyssal-cloak
name: Abyssal Cloak
page: 45
category: Special Rules
flavour: The crushing darkness of the deepest ocean surrounds the Merwyrm in battle.
paragraphs:
  - Any enemy model that targets this model during the Shooting phase suffers a -2 To Hit modifier for firing at long range,
    rather than the usual -1.
effects:
  - when: {step: check-range, by: the-enemy, is: long}
    add: {to-hit: -2}
    at: {step: roll-to-hit, by: the-enemy, in: shooting, not_in: stand-and-shoot}
    legacy:
      enemy: true
      when: {target_of: {kind: shooting, at_long_range: true}}
      add: {to-hit: -1}
  - when: {step: check-range, by: the-enemy, is: long}
    cancels: {rule: firing-at-long-range}
    at: {step: roll-to-hit, by: the-enemy, in: shooting, not_in: stand-and-shoot}
