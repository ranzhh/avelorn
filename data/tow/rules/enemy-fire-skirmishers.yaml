# Source: https://tow.whfb.app/unusual-formations/enemy-fire-skirmishers
id: enemy-fire-skirmishers
name: Enemy Fire (Skirmishers)
page: 185
category: Unusual Formations
paragraphs:
  - Due to their comparatively small size and ability to make use of all available cover, enemy units shooting at a unit of
    Skirmishers that consists entirely of models with a Unit Strength of 1 suffer a -1 To Hit modifier.
needs: [own-unit-strength]
effects:
  - add: {to-hit: -1}
    at: {step: roll-to-hit, by: the-enemy, in: shooting}
notes: the Unit Strength 1 restriction is not expressed, so a skirmishing unit
  of light cavalry gives enemies the -1 To Hit too.
