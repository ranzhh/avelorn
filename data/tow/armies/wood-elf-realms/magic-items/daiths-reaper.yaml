# Source: https://tow.whfb.app/magic-item/daiths-reaper
id: daiths-reaper
name: Daith's Reaper
page: 46
# A magic item (its printed type, recorded as the category), not a special
# rule: filed in the rules registry as a stopgap until magic items get a
# model of their own — carrier, points cost and uniqueness are not
# expressed. The first item modelled, chosen because its mechanic
# exercises the enemy-subject re-roll.
category: Magic Weapon
flavour: Amongst the most finely crafted weapons in all Athel Loren, this blade is said to be able to slice through steel
  without pause.
paragraphs:
  - 'Notes: Enemy models must re-roll any successful Armour Save rolls against wounds caused by this weapon.'
# Hand-authored, diffable against the paragraph above: the sentence's
# subject is the enemy and the covered dice are its successful ones, both
# transcribed. The enemy flip puts the grant on the attacks the bearer
# makes; "against wounds caused by this weapon" is the weapon-rules
# scope — the entry is referenced from the weapon's own profile, so it
# compiles only when the Reaper is in use.
effects:
  - reroll: make-armour-saves
    of: successful
    enemy: true
