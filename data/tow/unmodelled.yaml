# What the corpus prints that the engine does not read, each with why.
# `avelorn coverage` lists the gaps; tests/tow/test_coverage.py fails on a gap
# missing here and on an entry no gap needs. Subjects: the rule's slug for a
# rule without effects, <unit>/<row> for profile rows, the weapon or armour slug for
# printed notes, <unit>/<option> for options, and the option kind for a command
# model (champion, standard_bearer, musician).

# rule-without-effects: an entry holds the printed text, and nothing folds it.

- kind: rule-without-effects
  subject: ambushers
  reason: Held in reserve and arriving from a table edge; deployment is not modelled.
- kind: rule-without-effects
  subject: breath-weapon
  reason: A flame-template attack once per round; templates are not modelled.
- kind: rule-without-effects
  subject: champions-of-chrace
  reason: Challenges and Look Out, Sir! for joined characters; neither is modelled.
- kind: rule-without-effects
  subject: chariot-runners
  reason: Line of sight and movement around friendly chariots; neither is modelled.
- kind: rule-without-effects
  subject: chracian-warriors
  reason: Limits which characters may join; characters joining units are not modelled.
- kind: rule-without-effects
  subject: close-order
  reason: Formations are not modelled; every unit fights as a ranked block and the Close Order +1 combat result is not scored.
  issue: 28
- kind: rule-without-effects
  subject: counter-charge
  reason: A charge reaction; only Hold and Stand & Shoot are modelled.
  issue: 29
- kind: rule-without-effects
  subject: detachment
  reason: Detachments are not modelled.
  issue: 30
- kind: rule-without-effects
  subject: drilled
  reason: Free redress and marching near the enemy; movement manoeuvres are not modelled.
- kind: rule-without-effects
  subject: dwarf-crafted
  reason: Not authored yet; it waives the fixed -1 To Hit of a Stand & Shoot.
- kind: rule-without-effects
  subject: evasive
  reason: Fleeing when targeted by shooting; reactions to being shot are not modelled.
- kind: rule-without-effects
  subject: extra-attacks
  reason: Not authored yet; even authored, the Attacks count reads unit rules only, never a weapon profile's.
- kind: rule-without-effects
  subject: fast-cavalry
  reason: Quick Turn after marching; movement is not modelled.
- kind: rule-without-effects
  subject: fear
  reason: Psychology; Fear tests (refused charges, -1 To Hit on a failed test) are not modelled.
- kind: rule-without-effects
  subject: feigned-flight
  reason: Rallying after a Flee reaction; Flee reactions and rallying are not modelled.
  issue: 29
- kind: rule-without-effects
  subject: fire-and-flee
  reason: A charge reaction; Flee reactions are not modelled.
  issue: 29
- kind: rule-without-effects
  subject: first-charge
  reason: Makes the charge target Disrupted; Disruption is not modelled.
- kind: rule-without-effects
  subject: fly
  reason: Flying movement; movement is not modelled.
- kind: rule-without-effects
  subject: from-the-ashes
  reason: Hits or rebirth when the model loses its last Wound; nothing triggers on a model's removal.
- kind: rule-without-effects
  subject: hatred
  reason: Hated enemies are named by race; the foe gate has no race to match.
- kind: rule-without-effects
  subject: ignores-cover
  reason: Cover modifiers; terrain is not modelled.
- kind: rule-without-effects
  subject: immune-to-psychology
  reason: Psychology; Fear and Terror tests are not modelled, and no effect can force a Panic test passed.
- kind: rule-without-effects
  subject: impetuous
  reason: Forced charge declarations; declaring charges is not modelled.
- kind: rule-without-effects
  subject: ithilmar-armour
  reason: Dangerous Terrain re-rolls and Wizards wearing armour; terrain and magic are not modelled.
- kind: rule-without-effects
  subject: ithilmar-barding
  reason: Dangerous Terrain re-rolls and Wizards wearing armour; terrain and magic are not modelled.
- kind: rule-without-effects
  subject: kings-guard
  reason: Challenges once the General joins; challenges and joined characters are not modelled.
- kind: rule-without-effects
  subject: large-target
  reason: Cover and line of sight are not modelled, and no effect adds the shooting rank a foe gains against it.
- kind: rule-without-effects
  subject: magic-resistance
  reason: It modifies enemy Casting rolls; magic is not modelled.
- kind: rule-without-effects
  subject: motley-crew
  reason: Models armed and armoured differently in one unit; a fielded unit has one loadout.
- kind: rule-without-effects
  subject: move-through-cover
  reason: Difficult and dangerous terrain; terrain is not modelled.
- kind: rule-without-effects
  subject: multiple-shots
  reason: Firing X shots at a further -1 To Hit; no quantity counts shots per model.
- kind: rule-without-effects
  subject: naval-discipline
  reason: Stand & Shoot at any distance and a free redress; the Stand & Shoot distance limit and manoeuvres are not modelled.
  issue: 29
- kind: rule-without-effects
  subject: ogre-charge
  reason: Impact Hits AP improved by the Rank Bonus; no effect amount reads the Rank Bonus.
- kind: rule-without-effects
  subject: open-order
  reason: Formations are not modelled; every unit fights as a ranked block.
  issue: 28
- kind: rule-without-effects
  subject: poisoned-attacks
  reason: Not authored yet; no effect raises the To Wound roll on a natural 6 To Hit.
- kind: rule-without-effects
  subject: quick-shot
  reason: Not authored yet for the Moving and Shooting -1; the Stand & Shoot distance limit it waives is not enforced.
- kind: rule-without-effects
  subject: regimental-unit
  reason: May be accompanied by detachments; detachments are not modelled.
  issue: 30
- kind: rule-without-effects
  subject: resolute
  reason: Modifies Flee and Pursuit rolls; neither roll is modelled.
- kind: rule-without-effects
  subject: scouts
  reason: Deploying late and far forward; deployment is not modelled.
- kind: rule-without-effects
  subject: sons-of-caledor
  reason: Limits which characters may join; characters joining units are not modelled.
- kind: rule-without-effects
  subject: steady-in-the-ranks
  reason: Resists Disruption from flank and rear charges; Disruption is not modelled.
- kind: rule-without-effects
  subject: swiftstride
  reason: Charge range and Charge, Flee and Pursuit rolls; none is modelled.
- kind: rule-without-effects
  subject: vanguard
  reason: A move after deployment; deployment is not modelled.
- kind: rule-without-effects
  subject: venerable
  reason: Panic re-rolls for friendly units within 6"; no rule reaches a friendly unit.
- kind: rule-without-effects
  subject: wake-of-fire
  reason: Hits on a unit flown over; movement is not modelled.
- kind: rule-without-effects
  subject: warriors-of-nagarythe
  reason: Limits which characters may join; characters joining units are not modelled.
- kind: rule-without-effects
  subject: warriors-of-the-white-tower
  reason: Limits which characters may join; characters joining units are not modelled.

