# printed-notes: the notes stay in the weapon file once modelled, so these never
# go stale on their own. Delete an entry when its note is modelled.

- kind: printed-notes
  subject: brace-of-drakefire-pistols
  reason: Descriptive; nothing to model. The two profiles it describes are filed.
- kind: printed-notes
  subject: brace-of-ogre-pistols
  reason: Descriptive; nothing to model. The two profiles it describes are filed.
- kind: printed-notes
  subject: briny-breath
  reason: A -1 Initiative lasting until the next turn; no effect persists on a foe.
- kind: printed-notes
  subject: cavalry-spear
  reason: S+1 and AP -1 apply every turn, not only on the charge (profiles carry no gate); the troop-type limit is equipment legality. Its supporting-attack ban folds through Fight In Extra Rank.
- kind: printed-notes
  subject: ceremonial-halberd
  reason: Modelled elsewhere; Fight In Extra Rank's charge gate applies the supporting-attack ban.
- kind: printed-notes
  subject: cinderblast-bombs
  reason: Each hit becoming D6+1 hits; no effect multiplies hits.
- kind: printed-notes
  subject: hand-weapon
  reason: Descriptive; nothing to model. Every datasheet that carries a hand weapon lists it.
- kind: printed-notes
  subject: ironfist
  reason: Weapon rules reach only attacks made with the weapon, so a weapon's always-on +1 armour value has nothing to carry it; the magic-weapon exclusions need magic items.
  issue: 31
- kind: printed-notes
  subject: lance
  reason: S+2 and AP -2 apply every turn and against any foe, not only the unit charged (profiles carry no gate); the troop-type limit is equipment legality.
- kind: printed-notes
  subject: serpentine-tail
  reason: One attack must use this weapon; a unit fights with one weapon in hand.
- kind: printed-notes
  subject: serrated-maw
  reason: One (or two) attacks must use this weapon; a unit fights with one weapon in hand.
- kind: printed-notes
  subject: shield
  reason: Modelled elsewhere; Requires Two Hands bars the shield in combat.
- kind: printed-notes
  subject: thrusting-spear
  reason: The +1 Initiative when charged in the front arc has no gate on the arc; the troop-type limit is equipment legality. Its supporting-attack ban folds through Fight In Extra Rank.
  issue: 17

# inert-option: a command model is one entry per kind, covering every datasheet
# that sells one.

- kind: inert-option
  subject: champion
  reason: A champion fights as the rank and file (its row is unread) and challenges are not modelled; buying one changes only the cost.
  issue: 46
- kind: inert-option
  subject: musician
  reason: The +1 combat result on a drawn combat is not scored; its +1 Leadership to march and to rally needs movement and rallying, neither modelled.
- kind: inert-option
  subject: standard_bearer
  reason: The +1 combat result for a standard is not scored.
  issue: 28
