# unattached-effect: the effect is addressed, and no program registers a step
# it needs yet: its landing in one sequence, or the trigger or fact it reads.

- kind: unattached-effect
  subject: furious-charge/charge/the-charge-move
  reason: Reads the length of the charge move; no program registers The Charge Move until the charge lands (item 20).
- kind: unattached-effect
  subject: impact-hits/charge/the-charge-move
  reason: Reads the length of the charge move; no program registers The Charge Move until the charge lands (item 20).
- kind: unattached-effect
  subject: impact-hits/combat/impact-hits
  reason: Fills the Impact Hits slot; no program registers it until the charge lands (item 20).
- kind: unattached-effect
  subject: massed-infantry/combat-result/calculate-combat-result
  reason: Lands on Calculate Combat Result; no program registers it until the combat round lands (item 14).
- kind: unattached-effect
  subject: parry/combat/choose-combat-and-determine-who-can-fight
  reason: Reads the weapon chosen at Step 1.1; no program registers it until the combat round lands (item 14).
- kind: unattached-effect
  subject: requires-two-hands/combat/choose-combat-and-determine-who-can-fight
  reason: Lands on Step 1.1, where the weapon is chosen; no program registers it until the combat round lands (item 14).
- kind: unattached-effect
  subject: shieldwall/break/break-test
  reason: Lands on the Break Test; no program registers it until the steps from the Break Test on land (item 19).
- kind: unattached-effect
  subject: stomp-attacks/combat/stomp-attacks
  reason: Fills the Stomp Attacks slot; no program registers it until the combat round lands (item 14).
- kind: unattached-effect
  subject: stubborn/break/break-test
  reason: Lands on the Break Test; no program registers it until the steps from the Break Test on land (item 19).
- kind: unattached-effect
  subject: terror/break/break-test
  reason: Lands on the Break Test; no program registers it until the steps from the Break Test on land (item 19).
- kind: unattached-effect
  subject: terror/combat-result/who-is-the-winner
  reason: Reads which side won the combat; no program registers Who Is the Winner? until the combat round lands (item 14).
- kind: unattached-effect
  subject: valour-of-ages/panic/fled-through
  reason: Reads a Panic test caused by a fleeing friend; no program registers Fled Through, and no numbered item plans one.
- kind: unattached-effect
  subject: valour-of-ages/panic/make-panic-tests
  reason: Re-rolls a Panic test taken outside a volley; only the volley registers the Panic test, and no numbered item plans the others.
- kind: unattached-effect
  subject: veteran/break/restrain-and-reform
  reason: Re-rolls the Restraint test; no program registers Restrain & Reform, and no numbered item plans one.
- kind: unattached-effect
  subject: veteran/charge/redirecting-a-charge
  reason: Re-rolls the test to redirect a charge; no program registers Redirecting a Charge, and no numbered item plans one.
- kind: unattached-effect
  subject: veteran/charge/running-down-the-foe
  reason: Re-rolls the test to reform after running down the foe; no program registers Running Down the Foe, and no numbered item plans one.
- kind: unattached-effect
  subject: veteran/panic/make-panic-tests
  reason: Re-rolls a Panic test taken outside a volley; only the volley registers the Panic test, and no numbered item plans the others.
- kind: unattached-effect
  subject: veteran/strategy/rally-fleeing-units
  reason: Re-rolls the rally test; no program registers Rally Fleeing Units, and no numbered item plans one.

# unreached-effect: a program registers every step the effect needs, and no
# corpus side carries the rule to it.

- kind: unreached-effect
  subject: daiths-reaper/combat/make-armour-saves
  reason: Makes the enemy re-roll successful armour saves in combat; no corpus unit carries Daith's Reaper.
- kind: unreached-effect
  subject: dragon-armour/combat/ward-saves
  reason: Sets the Ward save in combat; only the Dragon Princes wear it, and the round fields no ridden unit.
- kind: unreached-effect
  subject: multiple-wounds/shooting/remove-casualties
  reason: Only the Great Eagle's Serrated Maw carries it, a combat profile, so no corpus side shoots with it.

# held-effect: a corpus side carries the effect to a step that cannot run it yet.

- kind: held-effect
  subject: cleaving-blow/combat/make-armour-saves
  reason: Denies the armour save in combat; the round holds it.
- kind: held-effect
  subject: martial-prowess/combat/roll-to-hit
  reason: Raises Weapon Skill To Hit in combat, for both sides' attacks; the round holds it.

# missing-mechanic: a printed clause needs a mechanic the engine lacks.

- kind: missing-mechanic
  subject: base-contact
  reason: Which models touch which is not modelled; a rule printed for models in base contact reaches the whole engaged unit (Blizzard Aura, Enfeebling Cold), and every front-rank model makes Impact Hits and Stomp Attacks.
- kind: missing-mechanic
  subject: challenges
  reason: Challenges are not modelled, so Multiple Wounds never counts for Overkill.
- kind: missing-mechanic
  subject: characters
  reason: Characters joining units are not modelled, so the clauses of Stubborn and Terror about a joined character have nothing to read.
- kind: missing-mechanic
  subject: facings
  reason: Flank and rear facings are not modelled, so Martial Prowess's supporting attacks to the flank and rear have no combat to land in.
- kind: missing-mechanic
  subject: formations
  reason: Formations are not modelled; Shieldwall's Close Order and Press of Battle's Combat Order are not read, a Skirmish formation keeps its Rank Bonus, and the legacy engine takes every unit with Skirmishers to be in the formation.
  issue: 28
- kind: missing-mechanic
  subject: magic-items
  reason: Magic items are not modelled; a hit caused by a magic item is not Magical, and a model carrying Flaming Attacks is not stopped from making Flaming attacks with a magic weapon.
  issue: 31
- kind: missing-mechanic
  subject: march-tests
  reason: Marching is not modelled, so Veteran never re-rolls the Leadership test a marching unit takes near the enemy.
- kind: missing-mechanic
  subject: multiple-units-in-combat
  reason: Only a combat of one unit against one is modelled, so Stomp Attacks are never divided between enemy units, and Massed Infantry compares the Unit Strength of one unit where the printed rule compares each side's.
- kind: missing-mechanic
  subject: own-unit-strength
  reason: No gate reads the Unit Strength of the bearer's own models, so Enemy Fire (Skirmishers) does not check that every model has a Unit Strength of 1; enemies shooting at Ellyrian Reavers in Skirmish formation, light cavalry of Unit Strength 2, take the -1 To Hit the rule withholds from them.
- kind: missing-mechanic
  subject: parts
  reason: A unit is read as one part until the program fields its parts (item 13), so Veteran's majority of models is not counted.
- kind: missing-mechanic
  subject: psychology-tests
  reason: Fear and Terror tests are not modelled (item 26 adds the slots); Terror's test on a charge target, and Veteran's re-roll of Fear and Terror tests, have no step.
- kind: missing-mechanic
  subject: regeneration-saves
  reason: No Regeneration save exists in the step vocabulary or the corpus, so Cleaving Blow denies only the armour save.
- kind: missing-mechanic
  subject: spells
  reason: Spells are not modelled, so no Magical or Flaming attack comes from a spell.
- kind: missing-mechanic
  subject: terrain
  reason: Terrain is not modelled, so Volley Fire's hill variant, where the front two ranks shoot, never arises.
- kind: missing-mechanic
  subject: weapon-runes
  reason: Weapon runes are not modelled, so Gromril Weapons never meets a hand weapon inscribed with runes.
- kind: missing-mechanic
  subject: wizards
  reason: No Wizard is in the corpus, so Dragon Armour's armour-without-penalty clause has no reader.
  issue: 10
